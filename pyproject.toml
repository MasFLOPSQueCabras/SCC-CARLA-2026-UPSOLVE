[project]
name = "scc-carla"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Isaac David", email = "orpheezt@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx2[socks]>=2.13.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "pyturso>=0.7.2",
    "pyyaml>=6.0.3",
    "rangehttpserver>=1.4.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
scc-carla = "scc_carla:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.81",
]
