[project]
name = "cabrita"
version = "1.0.0"
description = "Authorable clusters on libvirt and Helvetios"
readme = "README.md"
authors = [{ name = "Isaac David", email = "orpheezt@outlook.com" }]
requires-python = ">=3.14"
dependencies = [
    "ansible-core>=2.21.4",
    "jinja2>=3.1.6",
    "platformdirs>=4.11.11",
    "pydantic-settings>=2.15.0",
    "pyturso>=0.7.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.optional-dependencies]
libvirt = ["libvirt-python>=12.0.0"]
helvetios = ["httpx2[socks]>=2.13.0", "rangehttpserver>=1.4.0"]
all = ["cabrita[libvirt,helvetios]"]

[project.scripts]
cabrita = "cabrita.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.8", "ty>=0.0.81"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = ["e2e: requires explicitly enabled deployment infrastructure"]

[tool.ruff]
target-version = "py314"

[tool.ty.environment]
python-version = "3.14"
