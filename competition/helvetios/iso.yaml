schema_version: 1
name: helvetios-submission
provider: helvetios
description: Team 72 competition deployment; live hardware verification required before
  installation
configuration:
  profile: none
network:
  domain: cabrita.local
  subnet: 10.2.72.0/24
  gateway: 10.2.72.254
  dns: 10.2.72.254
  infiniband_subnet: 10.148.0.0/16
bastion:
  ssh_host: scc-bastion
  ssh_user: scct-2672
  remote_serve_dir: ~/cabrita_serve
  http_bind_ip: 10.7.12.102
  http_port: 8072
  proxy_mode: socks5
defaults:
  os:
    iso_name: Rocky-10.2-x86_64-minimal.iso
    iso_source: https://download.rockylinux.org/pub/rocky/10/isos/x86_64/Rocky-10.2-x86_64-minimal.iso
    username: scct-2672
  hardware:
    bios_profile: hpc
    target_disk: /dev/nvme0n1
    interface_name: eno1
    infiniband_interface: ib0
nodes:
- id: 1
  hostname: node1
  role: headnode
  ip: 10.2.72.1
  mac: b8:83:03:53:a4:fa
  bmc:
    ip: 10.1.72.1
    user: ${CABRITA_BMC_USER}
    password: ${CABRITA_BMC_PASSWORD}
- id: 2
  hostname: node2
  role: computenode
  ip: 10.2.72.2
  mac: b8:83:03:53:a5:f2
  bmc:
    ip: 10.1.72.2
    user: ${CABRITA_BMC_USER}
    password: ${CABRITA_BMC_PASSWORD}
- id: 3
  hostname: node3
  role: computenode
  ip: 10.2.72.3
  mac: b8:83:03:53:a6:3a
  bmc:
    ip: 10.1.72.3
    user: ${CABRITA_BMC_USER}
    password: ${CABRITA_BMC_PASSWORD}
access:
  public_key: ~/.ssh/carla_scc_ed25519.pub
  private_key: ~/.ssh/carla_scc_ed25519
  timeout: 14400
  max_workers: 3
bootstrap:
  method: embedded-kickstart
  artifact: installer
  build_on: bastion
  kickstart: ks.cfg.j2
artifacts:
  installer:
    source: https://download.rockylinux.org/pub/rocky/10/isos/x86_64/Rocky-10.2-x86_64-minimal.iso
    sha256: aac6ac3ce781b91a91ce78463405f66c611a5dca4b3840c79e5e01d97302f6c8
    format: iso
template_inputs:
  disk_serials:
    node1: ZC403005
    node2: ZC40255E
    node3: ZC4024DT
  node_macs:
    node1: b8:83:03:53:a4:fa
    node2: b8:83:03:53:a5:f2
    node3: b8:83:03:53:a6:3a
