name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libvirt-dev libvirt-daemon-system pkg-config
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest
      - name: Validate packaged Ansible playbooks
        run: |
          uv run ansible-galaxy collection install -r src/cabritactl/ansible/requirements.yml
          ANSIBLE_CONFIG=src/cabritactl/ansible/ansible.cfg ANSIBLE_ROLES_PATH=src/cabritactl/ansible/roles uv run ansible-playbook -i 'localhost,' --syntax-check src/cabritactl/ansible/playbooks/site.yaml src/cabritactl/ansible/playbooks/verify_ib.yaml
      - name: Validate authoring workflow
        run: |
          sudo systemctl start libvirtd.socket
          sudo usermod -aG libvirt "$USER"
          sudo virsh -c qemu:///system pool-define-as cabrita dir --target /var/lib/libvirt/images/cabrita
          sudo virsh -c qemu:///system pool-build cabrita
          sudo virsh -c qemu:///system pool-start cabrita
          touch /tmp/cabrita-plan-fixture.qcow2
          uv run cabritactl init /tmp/cabrita-plan --network existing --artifact /tmp/cabrita-plan-fixture.qcow2
          uv run cabritactl validate --cluster /tmp/cabrita-plan/cluster.yaml
          sg libvirt -c "uv run cabritactl plan --cluster /tmp/cabrita-plan/cluster.yaml --json"
          sg libvirt -c "uv run cabritactl up --dry-run --cluster /tmp/cabrita-plan/cluster.yaml"
      - name: Build distribution
        run: uv build
