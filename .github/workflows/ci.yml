name: ci

on:
  push:
    paths:
      - 'tests/**'
      - 'src/**'
      - 'configs/**'
      - 'templates/**'
      - 'ansible/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'tests/**'
      - 'src/**'
      - 'configs/**'
      - 'templates/**'
      - 'ansible/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check --output-format=github .

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install system libvirt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-daemon-system libvirt-dev pkg-config
          sudo systemctl start libvirtd || sudo service libvirtd start || true
          sudo chmod 666 /var/run/libvirt/libvirt-sock || true

      - name: Sync dependencies
        run: |
          uv sync --locked
          uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Unit tests
        run: uv run pytest

      - name: Type check
        run: uv run ty check --output-format=github

  validate:
    name: Validate Manifests & Ansible
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install system libvirt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-daemon-system libvirt-dev pkg-config
          sudo systemctl start libvirtd || sudo service libvirtd start || true
          sudo chmod 666 /var/run/libvirt/libvirt-sock || true

      - name: Sync dependencies
        run: |
          uv sync --locked
          uv sync --locked --all-extras

      - name: Validate pre-packaged cluster configs
        run: |
          uv run cabrita cluster validate configs/clusters/vm-standard.yaml
          uv run cabrita cluster validate configs/clusters/vm-hw-optimized.yaml
          uv run cabrita cluster validate configs/clusters/helvetios-hpc.yaml

      - name: Install Ansible collections
        run: |
          uv run ansible-galaxy collection install -r ansible/requirements.yml

      - name: Validate Ansible dynamic inventory
        run: |
          uv run ansible-inventory -i ansible/inventory/dynamic_inventory.py --list
          CABRITA_CLUSTER_MANIFEST=configs/clusters/vm-standard.yaml uv run ansible-inventory -i ansible/inventory/dynamic_inventory.py --list
          CABRITA_CLUSTER_MANIFEST=configs/clusters/vm-hw-optimized.yaml uv run ansible-inventory -i ansible/inventory/dynamic_inventory.py --list

      - name: Validate Ansible playbooks syntax
        run: |
          ANSIBLE_CONFIG=ansible/ansible.cfg uv run ansible-playbook -i ansible/inventory/dynamic_inventory.py --syntax-check ansible/playbooks/site.yaml ansible/playbooks/verify_ib.yaml

      - name: Verify cluster execution plan (Generic Libvirt)
        run: |
          uv run cabrita up --dry-run --cluster configs/clusters/vm-standard.yaml
          uv run cabrita down --dry-run --cluster configs/clusters/vm-standard.yaml
