[project]
name = "scc-provider-libvirt"
version = "0.1.0"
description = "Local QEMU/KVM Libvirt provider with CoW overlays and cloud-init CIDATA generation"
readme = "README.md"
authors = [
    { name = "Isaac David", email = "orpheezt@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "scc-core",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
scc-core = { workspace = true }
