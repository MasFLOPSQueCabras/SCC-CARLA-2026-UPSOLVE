[project]
name = "scc-provider-helvetios"
version = "0.1.0"
description = "Helvetios baremetal HPC provider plugin with HPE iLO Redfish and unprivileged bastion remote access"
readme = "README.md"
authors = [
    { name = "Isaac David", email = "orpheezt@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "scc-core",
    "httpx2[socks]>=2.13.0",
    "rangehttpserver>=1.4.0",
    "jinja2>=3.1.6",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
scc-core = { workspace = true }
