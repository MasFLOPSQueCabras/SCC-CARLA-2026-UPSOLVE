---
- name: Create the cluster user's SSH directory
  ansible.builtin.file:
    path: '{{ cluster_user_home }}/.ssh'
    state: directory
    owner: '{{ cluster_user }}'
    group: '{{ cluster_user }}'
    mode: '0700'
- name: Generate a distinct internal SSH key on each node
  ansible.builtin.command:
    argv: [ssh-keygen, -t, ed25519, -N, '', -f, '{{ cluster_user_home }}/.ssh/id_ed25519']
    creates: '{{ cluster_user_home }}/.ssh/id_ed25519'
  become_user: '{{ cluster_user }}'
- name: Read each node's public key
  ansible.builtin.slurp:
    src: '{{ cluster_user_home }}/.ssh/id_ed25519.pub'
  register: internal_public_key
- name: Authorize declared peer keys without distributing private keys
  ansible.posix.authorized_key:
    user: '{{ cluster_user }}'
    key: '{{ hostvars[item].internal_public_key.content | b64decode }}'
    state: present
  loop: '{{ groups["cluster"] }}'
- name: Configure SSH for declared cluster peers
  ansible.builtin.copy:
    dest: '{{ cluster_user_home }}/.ssh/config'
    owner: '{{ cluster_user }}'
    group: '{{ cluster_user }}'
    mode: '0600'
    content: |
      Host {{ groups['cluster'] | join(' ') }} {{ cluster_addresses.values() | join(' ') }}
          BatchMode yes
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          IdentityFile {{ cluster_user_home }}/.ssh/id_ed25519
