---
- name: Inspect the shared path
  ansible.builtin.stat:
    path: '{{ nfs_mount_dir }}'
    follow: false
  register: shared_path
- name: Remove the source server's symlink on restored clients
  ansible.builtin.file:
    path: '{{ nfs_mount_dir }}'
    state: absent
  when: inventory_hostname != nfs_server_host and shared_path.stat.islnk | default(false)
- name: Link the shared path on the server
  ansible.builtin.file:
    src: '{{ nfs_export_dir }}'
    dest: '{{ nfs_mount_dir }}'
    state: link
  when: inventory_hostname == nfs_server_host
- name: Mount the declared server on clients
  ansible.posix.mount:
    path: '{{ nfs_mount_dir }}'
    src: '{{ nfs_server_address }}:{{ nfs_export_dir }}'
    fstype: nfs
    opts: '{{ nfs_mount_options }}'
    state: mounted
  when: inventory_hostname != nfs_server_host
