---
- name: Apply declared kernel tuning
  ansible.posix.sysctl:
    name: '{{ item.key }}'
    value: '{{ item.value }}'
    sysctl_file: /etc/sysctl.d/90-cabrita.conf
    reload: true
  loop: '{{ sysctl | dict2items }}'
- name: Install tuned
  ansible.builtin.dnf:
    name: tuned
    state: present
- name: Start tuned
  ansible.builtin.systemd_service:
    name: tuned
    state: started
    enabled: true
- name: Read the active tuning profile
  ansible.builtin.command: tuned-adm active
  register: active_tuning
  changed_when: false
- name: Apply the declared profile
  ansible.builtin.command:
    argv: [tuned-adm, profile, '{{ tuned_profile }}']
  when: tuned_profile not in active_tuning.stdout
