---
- name: Install Spack build prerequisites
  ansible.builtin.dnf:
    name: [git, gcc, gcc-c++, gcc-gfortran, make, patch, tar, gzip, bzip2, xz, unzip, findutils, diffutils]
    state: present
- name: Clone the pinned Spack implementation and package recipes
  ansible.builtin.git:
    repo: https://github.com/spack/spack.git
    dest: '{{ nfs_mount_dir }}/spack'
    version: 2bfcc69fa870d3c6919be87593f22647981b648a
  become_user: '{{ cluster_user }}'
- name: Create the software environment directory
  ansible.builtin.file:
    path: '{{ nfs_mount_dir }}/environment'
    state: directory
    owner: '{{ cluster_user }}'
    group: '{{ cluster_user }}'
    mode: '0755'
- name: Write the pinned software specification
  ansible.builtin.template:
    src: spack.yaml.j2
    dest: '{{ nfs_mount_dir }}/environment/spack.yaml'
    owner: '{{ cluster_user }}'
    group: '{{ cluster_user }}'
    mode: '0644'
  register: spack_specification
- name: Discover the installed compiler once
  ansible.builtin.command:
    argv: ['{{ nfs_mount_dir }}/spack/bin/spack', compiler, find, --scope, site]
    creates: '{{ nfs_mount_dir }}/environment/.compiler-ready'
  become_user: '{{ cluster_user }}'
  register: compiler_discovery
- name: Record compiler discovery
  ansible.builtin.copy:
    dest: '{{ nfs_mount_dir }}/environment/.compiler-ready'
    content: ready
    owner: '{{ cluster_user }}'
    group: '{{ cluster_user }}'
    mode: '0644'
  when: compiler_discovery.changed
- name: Check for the installed environment
  ansible.builtin.stat:
    path: '{{ nfs_mount_dir }}/environment/view/bin/xhpl'
  register: installed_environment
- name: Concretize changed or missing software
  ansible.builtin.command:
    argv: ['{{ nfs_mount_dir }}/spack/bin/spack', -e, '{{ nfs_mount_dir }}/environment', concretize, --force]
  become_user: '{{ cluster_user }}'
  when: spack_specification.changed or not installed_environment.stat.exists
- name: Install changed or missing software
  ansible.builtin.command:
    argv: ['{{ nfs_mount_dir }}/spack/bin/spack', -e, '{{ nfs_mount_dir }}/environment', install, --no-cache, --keep-stage, --show-log-on-error, '-j{{ build_jobs }}']
  become_user: '{{ cluster_user }}'
  when: spack_specification.changed or not installed_environment.stat.exists
