---
- name: Require the declared InfiniBand interface
  ansible.builtin.assert:
    that: ib_interface in ansible_facts.interfaces
    fail_msg: 'Required InfiniBand interface {{ ib_interface }} is missing'
- name: Install InfiniBand tooling
  ansible.builtin.dnf:
    name: [rdma-core, infiniband-diags, libibverbs-utils, perftest]
    state: present
- name: Permit RDMA memory locking
  ansible.builtin.copy:
    dest: /etc/security/limits.d/90-cabrita-rdma.conf
    mode: '0644'
    content: |
      {{ cluster_user }} soft memlock unlimited
      {{ cluster_user }} hard memlock unlimited
- name: Write the declared InfiniBand connection
  ansible.builtin.copy:
    dest: /etc/NetworkManager/system-connections/cabrita-ib.nmconnection
    mode: '0600'
    content: |
      [connection]
      id=cabrita-ib
      type=infiniband
      interface-name={{ ib_interface }}
      [infiniband]
      transport-mode=datagram
      [ipv4]
      method=manual
      address1={{ cluster_addresses[inventory_hostname] }}/{{ ib_prefix }}
      [ipv6]
      method=disabled
  register: ib_connection
- name: Reload changed network connections
  ansible.builtin.command: nmcli connection reload
  when: ib_connection.changed
- name: Read the InfiniBand connection state
  ansible.builtin.command:
    argv: [nmcli, -g, GENERAL.STATE, device, show, '{{ ib_interface }}']
  register: ib_state
  changed_when: false
- name: Activate InfiniBand
  ansible.builtin.command: nmcli connection up cabrita-ib
  when: ib_connection.changed or '100 (connected)' not in ib_state.stdout
- name: Verify the declared fabric port
  ansible.builtin.command:
    argv: [ibstat, '{{ ucx_device.split(":")[0] }}', '{{ ucx_device.split(":")[1] }}']
  register: fabric
  changed_when: false
  failed_when: "fabric.rc != 0 or 'State: Active' not in fabric.stdout"
