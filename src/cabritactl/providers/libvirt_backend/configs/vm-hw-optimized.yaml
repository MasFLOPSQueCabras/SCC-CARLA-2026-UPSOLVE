schema_version: 1
name: vm-hw-optimized
provider: libvirt
description: "Hardware-optimized QEMU/KVM cluster with host-passthrough, UEFI, virtio-scsi, io_uring, and vhost multiqueue"

network:
  bridge: cabrita_bridge
  network_name: default
  subnet: "192.168.122.0/24"
  gateway: "192.168.122.1"
  dns: "192.168.122.1"
  model: virtio
  vhost: true
  queues: 2

defaults:
  os:
    cloud_image: "Rocky-10-GenericCloud-Base.latest.x86_64.qcow2"
    cloud_image_source: "https://download.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base.latest.x86_64.qcow2"
    username: "scct-2672"
  vm:
    firmware: efi
    machine_type: q35
    cpu_mode: host-passthrough
    iothreads: 1
    vcpus: 4
    memory_mb: 8192
    disk:
      size_gb: 40
      bus: scsi
      controller: virtio-scsi
      queues: 2
      io: io_uring
      cache: writeback
      discard: unmap

nodes:
  - id: 1
    hostname: node1
    role: headnode
    ip: "192.168.122.101"
    mac: "52:54:00:00:00:01"
    vm:
      vcpus: 8
      memory_mb: 16384
      disk:
        size_gb: 60

  - id: 2
    hostname: node2
    role: computenode
    ip: "192.168.122.102"
    mac: "52:54:00:00:00:02"

  - id: 3
    hostname: node3
    role: computenode
    ip: "192.168.122.103"
    mac: "52:54:00:00:00:03"
