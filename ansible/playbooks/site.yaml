---
- name: Configure SCC@CARLA Compute Cluster Nodes
  hosts: cluster
  become: true
  roles:
    - role: common
    - role: infiniband
    - role: cluster_ssh
    - role: nfs_server
      when: inventory_hostname == nfs_server_host
    - role: nfs_client
    - role: hpc_tune
    - role: spack
    - role: hpl
