---
- name: Configure the complete declared cluster
  hosts: cluster
  become: true
  any_errors_fatal: true
  roles:
    - common
    - role: infiniband
      when: transport == 'ucx'
    - role: hpc_tune
      when: tuning
    - cluster_ssh
    - nfs_server
    - nfs_client
    - role: spack
      when: software == 'spack' and inventory_hostname == nfs_server_host
    - role: hpl
      when: inventory_hostname == nfs_server_host
  tasks:
    - name: Check transport reachability between every pair of nodes
      ansible.builtin.command:
        argv: [ping, -c, '1', -W, '3', '{{ cluster_addresses[item] }}']
      loop: '{{ groups["cluster"] }}'
      when: item != inventory_hostname
      changed_when: false
