---
- name: Verify declared InfiniBand fabric and peer connectivity
  hosts: cluster
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require complete InfiniBand configuration
      ansible.builtin.assert:
        that:
          - transport | default('') == 'ucx'
          - cluster_addresses | default({}) | list | sort == groups['cluster'] | sort
        fail_msg: Supply the resolved UCX inventory for every declared node
    - name: Require an active fabric port
      ansible.builtin.command:
        argv: [ibstat, '{{ ucx_device.split(":")[0] }}', '{{ ucx_device.split(":")[1] }}']
      register: fabric
      changed_when: false
      failed_when: "fabric.rc != 0 or 'State: Active' not in fabric.stdout"
    - name: Verify connectivity to every declared peer
      ansible.builtin.command:
        argv: [ping, -c, '3', -W, '3', '{{ cluster_addresses[item] }}']
      loop: '{{ groups["cluster"] }}'
      when: item != inventory_hostname
      changed_when: false
