---
- name: Ensure cluster nodes and IPoIB interfaces are mapped in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED CLUSTER HOSTS"
    block: |
      10.2.{{ team_id }}.1 node1
      10.2.{{ team_id }}.2 node2
      10.2.{{ team_id }}.3 node3
      10.10.{{ team_id }}.1 node1-ib
      10.10.{{ team_id }}.2 node2-ib
      10.10.{{ team_id }}.3 node3-ib

- name: Install base operational packages
  ansible.builtin.dnf:
    name:
      - pciutils
      - ethtool
      - git
      - tmux
      - tar
      - curl
    state: present

- name: Ensure firewalld is enabled and running
  ansible.builtin.systemd_service:
    name: firewalld
    state: started
    enabled: true

- name: Ensure SSH is allowed in public firewalld zone
  ansible.posix.firewalld:
    service: ssh
    zone: public
    permanent: true
    state: enabled
    immediate: true
  ignore_errors: true
