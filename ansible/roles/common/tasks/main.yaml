---
- name: Install shared operational packages
  ansible.builtin.dnf:
    name: [curl, python3, nfs-utils, openssh-clients, firewalld, libgfortran]
    state: present
- name: Install native MPI and HPL build dependencies
  ansible.builtin.dnf:
    name: [gcc, gcc-gfortran, make, tar, gzip, openmpi, openmpi-devel, openblas-devel]
    enablerepo: crb
    state: present
  when: software == 'system'
- name: Write cluster host identities
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    mode: '0644'
- name: Start the firewall
  ansible.builtin.systemd_service:
    name: firewalld
    state: started
    enabled: true
- name: Allow traffic between the declared cluster peers
  ansible.posix.firewalld:
    zone: trusted
    source: '{{ cluster_addresses[item] }}/32'
    state: enabled
    permanent: true
    immediate: true
  loop: '{{ groups["cluster"] }}'
- name: Keep management SSH available
  ansible.posix.firewalld:
    service: ssh
    state: enabled
    permanent: true
    immediate: true
