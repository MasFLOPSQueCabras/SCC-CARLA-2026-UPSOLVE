---
- name: Create the benchmark workspace
  ansible.builtin.file:
    path: '{{ nfs_mount_dir }}/hpl'
    state: directory
    owner: '{{ cluster_user }}'
    group: '{{ cluster_user }}'
    mode: '0755'
- name: Build the pinned reference HPL with system MPI and BLAS
  when: software == 'system' and hpl_binary is none
  become_user: '{{ cluster_user }}'
  block:
    - name: Fetch verified HPL source
      ansible.builtin.get_url:
        url: https://www.netlib.org/benchmark/hpl/hpl-2.3.tar.gz
        dest: '{{ nfs_mount_dir }}/hpl/hpl-2.3.tar.gz'
        checksum: sha256:32c5c17d22330e6f2337b681aded51637fb6008d3f0eb7c277b163fadd612830
        mode: '0644'
    - name: Extract HPL once
      ansible.builtin.unarchive:
        src: '{{ nfs_mount_dir }}/hpl/hpl-2.3.tar.gz'
        dest: '{{ nfs_mount_dir }}/hpl'
        remote_src: true
        creates: '{{ nfs_mount_dir }}/hpl/hpl-2.3/Makefile'
    - name: Write the native HPL build configuration
      ansible.builtin.template:
        src: Make.cabrita.j2
        dest: '{{ nfs_mount_dir }}/hpl/hpl-2.3/Make.cabrita'
        mode: '0644'
      register: build_configuration
    - name: Check for the prepared HPL binary
      ansible.builtin.stat:
        path: '{{ nfs_mount_dir }}/hpl/hpl-2.3/bin/cabrita/xhpl'
      register: native_binary
    - name: Initialize HPL build directories before parallel compilation
      ansible.builtin.command:
        argv: [make, -j1, arch=cabrita, startup]
        chdir: '{{ nfs_mount_dir }}/hpl/hpl-2.3'
      when: build_configuration.changed or not native_binary.stat.exists
    - name: Clean objects when build settings changed
      ansible.builtin.command:
        argv: [make, -j1, arch=cabrita, clean]
        chdir: '{{ nfs_mount_dir }}/hpl/hpl-2.3'
      when: build_configuration.changed and native_binary.stat.exists
    - name: Compile HPL when missing or configuration changed
      ansible.builtin.command:
        argv: [make, '-j{{ build_jobs }}', arch=cabrita, build]
        chdir: '{{ nfs_mount_dir }}/hpl/hpl-2.3'
      when: build_configuration.changed or not native_binary.stat.exists
- name: Select the HPL executable
  ansible.builtin.set_fact:
    resolved_hpl_binary: "{{ hpl_binary if hpl_binary is not none else (nfs_mount_dir + '/environment/view/bin/xhpl' if software == 'spack' else nfs_mount_dir + '/hpl/hpl-2.3/bin/cabrita/xhpl') }}"
- name: Check the selected executable
  ansible.builtin.stat:
    path: '{{ resolved_hpl_binary }}'
  register: selected_hpl
- name: Require a functioning software installation
  ansible.builtin.assert:
    that: selected_hpl.stat.exists and selected_hpl.stat.executable
    fail_msg: 'Required HPL binary is missing: {{ resolved_hpl_binary }}'
- name: Write benchmark inputs and runner
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ nfs_mount_dir }}/hpl/{{ item.dest }}'
    owner: '{{ cluster_user }}'
    group: '{{ cluster_user }}'
    mode: '{{ item.mode }}'
  loop:
    - {src: HPL.dat.j2, dest: HPL.dat, mode: '0644'}
    - {src: mpi_hosts.j2, dest: hosts, mode: '0644'}
    - {src: run_hpl.sh.j2, dest: run_hpl.sh, mode: '0755'}
- name: Install numerical result validation
  ansible.builtin.copy:
    src: check_result.py
    dest: '{{ nfs_mount_dir }}/hpl/check_result.py'
    mode: '0644'
