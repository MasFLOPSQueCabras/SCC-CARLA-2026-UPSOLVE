---
- name: Stop cloned NFS servers on client nodes
  ansible.builtin.systemd_service:
    name: nfs-server
    state: stopped
    enabled: false
  when: inventory_hostname != nfs_server_host
- name: Remove a cloned Cabrita export from client nodes
  ansible.builtin.file:
    path: /etc/exports.d/cabrita.exports
    state: absent
  when: inventory_hostname != nfs_server_host
- name: Create the server export
  ansible.builtin.file:
    path: '{{ nfs_export_dir }}'
    state: directory
    owner: '{{ cluster_user }}'
    group: '{{ cluster_user }}'
    mode: '0755'
  when: inventory_hostname == nfs_server_host
- name: Export storage only to declared peers
  ansible.builtin.copy:
    dest: /etc/exports.d/cabrita.exports
    mode: '0644'
    content: |
      {% for host in groups['cluster'] %}
      {{ nfs_export_dir }} {{ cluster_addresses[host] }}(rw,sync,root_squash,no_subtree_check)
      {% endfor %}
  when: inventory_hostname == nfs_server_host
  notify: Reload Cabrita exports
- name: Start the NFS server before mounting clients
  ansible.builtin.systemd_service:
    name: nfs-server
    state: started
    enabled: true
  when: inventory_hostname == nfs_server_host
- name: Publish changed exports before the client role
  ansible.builtin.meta: flush_handlers
- name: Wait for NFSv4 recovery before clients open shared files
  ansible.builtin.command:
    argv: [cat, /proc/fs/nfsd/v4_end_grace]
  register: nfs_grace
  changed_when: false
  until: nfs_grace.stdout | trim == 'Y'
  retries: 60
  delay: 2
  when: inventory_hostname == nfs_server_host
